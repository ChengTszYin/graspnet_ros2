# Conda environment for the GraspNet node — runtime only, never used to build ROS.
# Default target: x86_64 desktop with an NVIDIA GPU.
# See README.md for Jetson Orin NX and CPU-only variants.
name: graspnet
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - pytorch-cuda=11.8        # CUDA runtime for torch; drop for CPU-only
  - cuda-toolkit=11.8        # provides nvcc to compile pointnet2/knn; drop for CPU-only
  - numpy
  - scipy
  - pillow
  - tqdm
  - pip
  - pip:
      - open3d
      - graspnetAPI
      - tensorboard